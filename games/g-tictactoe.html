<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>איקס עיגול</title>
<style>
body{margin:0;padding:4px;background:#111;color:#fff;font-family:sans-serif;font-size:14px;max-width:240px;text-align:center}
a{color:#8cf}.top{text-align:right}
.cell{width:66px;height:66px;font-size:34px;margin:2px;background:#222;color:#fff;border:2px solid #555}
.cell.sel{border-color:#fc0}
#st{min-height:18px;font-size:13px;color:#ccc}
</style>
</head>
<body>
<div class="top"><a href="../games.html">◀ כל המשחקים</a></div>
<h2>❌ איקס-עיגול</h2>
<div id="b"></div>
<div id="st"></div>
<div>אתה X · נצחונות: <b id="sc">0</b></div>
<script>
var bEl=document.getElementById('b'),stEl=document.getElementById('st'),scEl=document.getElementById('sc');
var cells=[],board,sel,over,wins=0,lock=false;
var WINS=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
for(var i=0;i<9;i++){var c=document.createElement('button');c.className='cell';c.textContent='';bEl.appendChild(c);cells.push(c);
  if(i%3===2)bEl.appendChild(document.createElement('br'));}
function say(t){stEl.textContent=t;}
function draw(){for(var i=0;i<9;i++){cells[i].textContent=board[i];cells[i].className='cell'+(i===sel&&!over?' sel':'');}}
function reset(){board=['','','','','','','','',''];sel=4;over=false;lock=false;draw();say('חצים לבחירה · אמצעי לסימון');}
function winner(){for(var i=0;i<WINS.length;i++){var w=WINS[i];
  if(board[w[0]]&&board[w[0]]===board[w[1]]&&board[w[1]]===board[w[2]])return board[w[0]];}
  return board.every(function(c){return c;})?'D':null;}
function aiMove(){
  var mv=bestMove('O')||bestMove('X');
  if(mv==null){var free=[];for(var i=0;i<9;i++)if(!board[i])free.push(i);
    mv=board[4]===''?4:free[Math.floor(Math.random()*free.length)];}
  board[mv]='O';
}
function bestMove(p){for(var i=0;i<WINS.length;i++){var w=WINS[i];
  var vals=[board[w[0]],board[w[1]],board[w[2]]];
  var np=vals.filter(function(v){return v===p;}).length,ne=vals.filter(function(v){return !v;}).length;
  if(np===2&&ne===1)return w[vals.indexOf('')];}return null;}
function endCheck(){
  var w=winner();
  if(w==='X'){over=true;wins++;scEl.textContent=wins;say('ניצחת! אמצעי למשחק חדש');}
  else if(w==='O'){over=true;say('המחשב ניצח. אמצעי לנסות שוב');}
  else if(w==='D'){over=true;say('תיקו. אמצעי למשחק חדש');}
  draw();return !!w;
}
cells.forEach(function(c,i){c.addEventListener('click',function(){play(i);});});
function play(i){
  if(over||lock||board[i])return;
  sel=i;board[i]='X';
  if(endCheck())return;
  lock=true;draw();say('המחשב חושב...');
  setTimeout(function(){aiMove();lock=false;endCheck();if(!over)say('תורך');},400);
}
document.addEventListener('keydown',function(e){
  var k=e.key,r=Math.floor(sel/3),c=sel%3;
  if(k==='ArrowUp'){sel=((r+2)%3)*3+c;draw();e.preventDefault();}
  else if(k==='ArrowDown'){sel=((r+1)%3)*3+c;draw();e.preventDefault();}
  else if(k==='ArrowLeft'){sel=r*3+((c+1)%3);draw();e.preventDefault();}
  else if(k==='ArrowRight'){sel=r*3+((c+2)%3);draw();e.preventDefault();}
  else if(k==='Enter'){if(over)reset();else play(sel);e.preventDefault();}
});
reset();
</script>
</body>
</html>
