<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>דודל קפיצה</title>
<style>
body{margin:0;padding:4px;background:#111;color:#fff;font-family:sans-serif;font-size:14px;max-width:240px;text-align:center}
a{color:#8cf}.top{text-align:right}
canvas{background:#f5f0e1;border:1px solid #444}
#st{min-height:18px;font-size:13px;color:#ccc}
</style>
</head>
<body>
<div class="top"><a href="../games.html">◀ כל המשחקים</a></div>
<h2>🟢 דודל קפיצה</h2>
<canvas id="c" width="232" height="260"></canvas>
<div id="st"></div>
<div>גובה: <b id="sc">0</b></div>
<script>
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),stEl=document.getElementById('st'),scEl=document.getElementById('sc');
var W=232,H=260;
var p,plats,score,over,run,keys,timer,top;
function rnd(a,b){return a+Math.random()*(b-a);}
function reset(){
  p={x:W/2,y:H-60,vy:0,w:22,h:22};
  plats=[];var y=H-20;
  plats.push({x:20,y:H-10,w:70,m:0,vx:0});
  while(y>0){y-=rnd(40,70);plats.push({x:rnd(0,W-70),y:y,w:64,m:Math.random()<0.25?1:0,vx:Math.random()<0.5?-1:1});}
  score=0;top=0;over=false;run=false;keys={};scEl.textContent='0';draw();say('אמצעי להתחלה · חצים לזוז');
}
function say(t){stEl.textContent=t;}
function step(){
  if(keys.l)p.x-=3;if(keys.r)p.x+=3;
  if(p.x<-p.w)p.x=W;if(p.x>W)p.x=-p.w;
  p.vy+=0.35;p.y+=p.vy;
  if(p.vy>0){for(var i=0;i<plats.length;i++){var q=plats[i];
    if(p.x+p.w>q.x&&p.x<q.x+q.w&&p.y+p.h>=q.y&&p.y+p.h<=q.y+14){p.vy=-10.5;p.y=q.y-p.h;break;}}}
  for(var j=0;j<plats.length;j++){var m=plats[j];if(m.m){m.x+=m.vx;if(m.x<0||m.x+m.w>W)m.vx*=-1;}}
  if(p.y<H/2-20){var d=(H/2-20)-p.y;p.y=H/2-20;top+=Math.round(d);score=top;scEl.textContent=score;
    for(var k=0;k<plats.length;k++)plats[k].y+=d;
    plats=plats.filter(function(q){return q.y<H+20;});
    var minY=Math.min.apply(null,plats.map(function(q){return q.y;}));
    while(minY>0){minY-=rnd(40,70);plats.push({x:rnd(0,W-70),y:minY,w:64,m:Math.random()<0.3?1:0,vx:Math.random()<0.5?-1.5:1.5});}}
  if(p.y>H){over=true;run=false;clearInterval(timer);say('נפלת! גובה: '+score+' - אמצעי לחדש');}
  draw();
}
function draw(){
  ctx.fillStyle='#f5f0e1';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#c33';ctx.lineWidth=1;
  for(var g=0;g<H;g+=26){ctx.beginPath();ctx.moveTo(0,g);ctx.lineTo(W,g);ctx.stroke();}
  plats.forEach(function(q){ctx.fillStyle=q.m?'#48c':'#3a3';ctx.fillRect(q.x,q.y,q.w,10);});
  ctx.fillStyle='#4c4';ctx.beginPath();ctx.arc(p.x+p.w/2,p.y+p.h/2,11,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x+7,p.y+8,3.5,0,7);ctx.arc(p.x+15,p.y+8,3.5,0,7);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(p.x+7,p.y+8,1.5,0,7);ctx.arc(p.x+15,p.y+8,1.5,0,7);ctx.fill();
}
function start(){if(run)return;reset();run=true;say('');timer=setInterval(step,30);}
document.addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='ArrowLeft'){keys.l=true;e.preventDefault();}
  else if(k==='ArrowRight'){keys.r=true;e.preventDefault();}
  else if(k==='Enter'){if(!run)start();}
});
document.addEventListener('keyup',function(e){
  if(e.key==='ArrowLeft')keys.l=false;
  if(e.key==='ArrowRight')keys.r=false;
});
reset();
</script>
</body>
</html>
