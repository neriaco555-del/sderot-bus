<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>סנייק</title>
<style>
body{margin:0;padding:4px;background:#111;color:#fff;font-family:sans-serif;font-size:15px;max-width:240px;text-align:center}
a{color:#8cf}.top{text-align:right}
canvas{background:#000;border:1px solid #444}
#st{min-height:18px;font-size:13px;color:#ccc}
</style>
</head>
<body>
<div class="top"><a href="../games.html">◀ כל המשחקים</a></div>
<h2>🐍 סנייק</h2>
<canvas id="c" width="232" height="220"></canvas>
<div id="st"></div>
<div>ניקוד: <b id="sc">0</b></div>
<script>
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),stEl=document.getElementById('st'),scEl=document.getElementById('sc');
var N=20,S=11,OX=Math.floor((232-N*S)/2),OY=0;
var sn,dir,nd,food,score,over,run,timer;
function rnd(n){return Math.floor(Math.random()*n);}
function same(a,b){return a[0]===b[0]&&a[1]===b[1];}
function place(){do{food=[rnd(N),rnd(N)];}while(sn.some(function(s){return same(s,food);}));}
function reset(){sn=[[10,10],[9,10],[8,10]];dir=[1,0];nd=[1,0];score=0;over=false;run=false;scEl.textContent='0';place();draw();say('לחץ על האמצעי להתחלה');}
function say(t){stEl.textContent=t;}
function step(){
  dir=nd;
  var h=[sn[0][0]+dir[0],sn[0][1]+dir[1]];
  if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||sn.some(function(s){return same(s,h);})){over=true;run=false;clearInterval(timer);say('נגמר! ניקוד: '+score+' - אמצעי למשחק חדש');draw();return;}
  sn.unshift(h);
  if(same(h,food)){score+=10;scEl.textContent=score;place();if(sn.length===N*N){over=true;run=false;clearInterval(timer);say('ניצחת! '+score);}}
  else sn.pop();
  draw();
}
function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,232,220);
  ctx.fillStyle='#f33';ctx.fillRect(OX+food[0]*S+1,OY+food[1]*S+1,S-2,S-2);
  ctx.fillStyle='#3d3';
  sn.forEach(function(s,i){ctx.fillStyle=i?'#3d3':'#ff3';ctx.fillRect(OX+s[0]*S+1,OY+s[1]*S+1,S-2,S-2);});
}
function start(){if(run)return;reset();run=true;say('');timer=setInterval(step,140);}
document.addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='ArrowUp'&&(dir[1]!==1)){nd=[0,-1];e.preventDefault();}
  else if(k==='ArrowDown'&&(dir[1]!==-1)){nd=[0,1];e.preventDefault();}
  else if(k==='ArrowLeft'&&(dir[0]!==1)){nd=[-1,0];e.preventDefault();}
  else if(k==='ArrowRight'&&(dir[0]!==-1)){nd=[1,0];e.preventDefault();}
  else if(k==='Enter'){if(!run)start();}
  if(run&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(k)>=0)e.preventDefault();
});
reset();
</script>
</body>
</html>
