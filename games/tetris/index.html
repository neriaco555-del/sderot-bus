<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>טטריס</title>
<link rel="stylesheet" href="styles.css">
<style>
body{max-width:240px;margin:0 auto;padding:4px !important;display:block !important;min-height:0 !important}
.container{flex-direction:column !important;gap:8px !important;padding:10px !important;max-width:232px;margin:0 auto}
canvas#tetris{width:150px !important;height:auto !important;margin:0 auto}
.game-info{text-align:center}
.controls{display:none !important}
.backlink{display:block;background:#222;color:#fff !important;text-decoration:none;padding:8px;font-size:15px;margin-bottom:4px;text-align:center}
.hint{font-size:12px;color:#bbb;text-align:center}
#start-button{font-size:16px;padding:10px}
</style>
</head>
<body>
<a class="backlink" href="../../games.html">◀ כל המשחקים</a>
<div class="container">
<canvas id="tetris" width="240" height="400"></canvas>
<div class="game-info">
<h1>TETRIS</h1>
<div class="score-display">
<p>Score: <span id="score">0</span></p>
<p>Lines: <span id="lines">0</span></p>
<p>Level: <span id="level">1</span></p>
</div>
<div class="next-piece">
<p>Next:</p>
<canvas id="next" width="100" height="100"></canvas>
</div>
<button id="start-button">Start/Pause</button>
</div>
</div>
<div class="hint">חצים: זוז/סובב/הורד · טטריס קוד פתוח (MIT) מאת trzaskos</div>
<script src="tetris.js"></script>
</body>
</html>
