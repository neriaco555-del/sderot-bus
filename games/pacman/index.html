<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>פק-מן</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="pacman-canvas.css">
<style>
body{max-width:240px;margin:0 auto;background:#000;color:#fff;font-family:sans-serif}
.main,.content{max-width:232px !important;margin:0 auto !important}
.backlink{display:block;background:#222;color:#fff !important;text-decoration:none;padding:8px;font-size:15px;margin:4px;text-align:center}
#menu-buttons li.button{border:2px solid #555;padding:8px;margin:4px;list-style:none;text-align:center}
#menu-buttons li.button:focus{border-color:#fc0;outline:none}
#menu-buttons ul{padding:0}
.hint{font-size:12px;color:#bbb;text-align:center}
</style>
</head>
<body>
<a class="backlink" href="../../games.html">◀ כל המשחקים</a>
<div class="container">
<div class="main">
<div class="content" id="game-content">
	<div class="game wrapper">
		<div class="score">Score:</div>
		<div class="level">Lvl:</div>
		<div class="lives">Lives: </div>
		<div class="controlSound">
			<img src="img/audio-icon-mute.png" id="mute">
		</div>
		<div id="canvas-container">
			<div id="canvas-overlay-container" tabindex="0">
				<div id="canvas-overlay-content">
					<div id="title">Pacman Canvas</div>
					<div><p id="text">Click to Play</p></div>
				</div>
			</div>
			<canvas id="myCanvas" width="540" height="390">
			<p>Canvas not supported</p>
			</canvas>
		</div>
		<div class="controls" id="game-buttons">
			<div>
				<span id="up" class="controlButton" tabindex="0">&uarr;</span>
			</div>
			<div>
				<span id="left" class="controlButton" tabindex="0">&larr;</span>
				<span id="down" class="controlButton" tabindex="0">&darr;</span>
				<span id="right" class="controlButton" tabindex="0">&rarr;</span>
			</div>
		</div>
		<div class="controls" id="menu-buttons">
			<ul>
				<li class="button" id="newGame" tabindex="0">New Game</li>
				<li class="button" id="info" tabindex="0">Info</li>
			</ul>
		</div>
	</div>
<div class="hint">חצים לזוז · אמצעי = התחל/עצור<br>פק-מן קוד פתוח (CC0) מאת platzhersh</div>
<div class="content" id="info-content" style="display:none">
	<div class="button" id="back" tabindex="0">&lt; back</div>
	<div>
		<h1>Info</h1>
		<p>Pacman Canvas is Open Source (CC0), written by platzhersh. Code on github: platzhersh/pacman-canvas.</p>
	</div>
</div>
</div>
</div>
<script src="js/jquery-1.10.2.min.js" type="text/javascript"></script>
<script src="pacman-canvas.js" type="text/javascript"></script>
<script>
// Nokia: Enter activates focused control, otherwise starts/pauses via overlay/canvas
document.addEventListener('keydown',function(e){
	if(e.key!=='Enter')return;
	var a=document.activeElement;
	if(a&&a!==document.body&&typeof a.click==='function'&&(a.classList.contains('button')||a.classList.contains('controlButton')||a.id==='canvas-overlay-container')){a.click();e.preventDefault();return;}
	var ov=document.getElementById('canvas-overlay-container');
	if(ov&&ov.style.display!=='none'){ov.click();}
	else{var c=document.getElementById('myCanvas');if(c)c.click();}
	e.preventDefault();
});
</script>
</body>
</html>
