<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, initial-scale=1">
<title>אוטובוסים שדרות</title>
<style>
body{font-family:Arial,sans-serif;background:#fff;color:#000;margin:0;padding:4px;max-width:232px;font-size:18px}
h1{font-size:20px;margin:4px 0;text-align:center;background:#0066cc;color:#fff;padding:6px}
h2{font-size:18px;margin:8px 0 2px;background:#eee;padding:4px}
input{width:96%;font-size:18px;padding:6px;margin:4px 0;border:2px solid #0066cc}
button{display:block;width:100%;font-size:20px;padding:10px;margin:4px 0;background:#0066cc;color:#fff;border:none;font-weight:bold}
button:focus{background:#ff6600}
.stop{border:2px solid #000;margin:6px 0;padding:6px}
.stop b{font-size:19px}
.meta{font-size:15px;color:#333}
.live{border-top:2px dashed #0066cc;margin-top:6px;padding-top:6px}
.bus{background:#e8f5e9;border:2px solid #2e7d32;margin:6px 0;padding:8px}
.bus .num{font-size:26px;font-weight:bold}
.bus .eta{font-size:22px;font-weight:bold;color:#1b5e20}
.bus .sub{font-size:15px}
#status{font-size:16px;background:#ffffcc;padding:6px;margin:4px 0}
small{font-size:13px;color:#555}
hr{border:1px solid #999}
</style>
</head>
<body>
<h1>🚌 אוטובוסים</h1>
<label for="addr"><b>כתובת או מקום:</b></label>
<input id="addr" type="text" value="יצחק נבון 52 שדרות">
<button id="b1" accesskey="1">1 - חפש תחנות לידי</button>
<button id="b3" accesskey="3">3 - תחנה מרכזית</button>
<button id="b4" accesskey="4">4 - קניון / בית חולים</button>
<hr>
<label for="code"><b>או מספר תחנה:</b></label>
<input id="code" type="text" inputmode="numeric" placeholder="למשל 3948">
<button id="b2" accesskey="2">2 - זמנים לתחנה</button>
<div id="status">מוכן. לחץ 1 לחיפוש.</div>
<div id="out"></div>
<small>זמנים חיים: הסדנא לידע ציבורי (נתוני משרד התחבורה). בית: יצחק נבון 52 שדרות. טיפ: כתוב עיר בתיבה ואז 3.</small>
<script>
var HOME_LAT = 31.5357653, HOME_LON = 34.5990550, HOME_CITY = 'שדרות';
var API = 'https://open-bus-stride-api.hasadna.org.il';
var statusEl = document.getElementById('status');
var outEl = document.getElementById('out');
var addrEl = document.getElementById('addr');
var stopCache = {}, lineCache = {};
function say(t){ statusEl.textContent = t; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function distKm(lat1,lon1,lat2,lon2){
  var R=6371,dLa=(lat2-lat1)*Math.PI/180,dLo=(lon2-lon1)*Math.PI/180;
  var a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return 2*R*Math.asin(Math.sqrt(a));
}
function agoMin(iso){
  var t = Date.parse(iso);
  if(isNaN(t)) return -1;
  return Math.max(0, Math.round((Date.now()-t)/60000));
}
function fetchJSON(url, ms){
  ms = ms || 22000;
  var c = new AbortController();
  var t = setTimeout(function(){ c.abort(); }, ms);
  return fetch(url, {signal: c.signal, headers: {'Accept':'application/json'}}).then(function(r){
    clearTimeout(t);
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).catch(function(e){ clearTimeout(t); throw e; });
}
function dedupe(stops){
  var seen = {}, out = [];
  stops.sort(function(a,b){ return (a.date<b.date)?1:-1; });
  for(var i=0;i<stops.length;i++){ var c=stops[i].code; if(!seen[c]){ seen[c]=1; out.push(stops[i]); } }
  return out;
}
function getCityStops(city){
  if(stopCache[city]) return Promise.resolve(stopCache[city]);
  return fetchJSON(API+'/gtfs_stops/list?limit=500&city='+encodeURIComponent(city), 25000).then(function(s){
    s = dedupe(s||[]);
    stopCache[city] = s;
    return s;
  });
}
function batchLineInfo(line_refs){
  var fresh = line_refs.filter(function(lr){ return !lineCache[lr]; });
  if(!fresh.length){
    var m = {};
    line_refs.forEach(function(lr){ m[lr]=lineCache[lr]; });
    return Promise.resolve(m);
  }
  return fetchJSON(API+'/siri_rides/list?limit='+Math.max(fresh.length,1)+'&siri_route__line_refs='+fresh.join(','), 20000).then(function(r){
    (r||[]).forEach(function(x){
      var lr = x.siri_route__line_ref;
      if(!lineCache[lr]) lineCache[lr] = {num:String(lr), dest:'', op:''};
      if(x.gtfs_route__route_short_name) lineCache[lr].num = x.gtfs_route__route_short_name;
      if(x.gtfs_route__route_long_name) lineCache[lr].dest = x.gtfs_route__route_long_name;
      if(x.gtfs_route__agency_name) lineCache[lr].op = x.gtfs_route__agency_name;
    });
    fresh.forEach(function(lr){ if(!lineCache[lr]) lineCache[lr]={num:String(lr),dest:'',op:''}; });
    var m2 = {};
    line_refs.forEach(function(lr){ m2[lr]=lineCache[lr]; });
    return m2;
  }).catch(function(){
    var m3 = {};
    line_refs.forEach(function(lr){ if(!lineCache[lr]) lineCache[lr]={num:String(lr),dest:'',op:''}; m3[lr]=lineCache[lr]; });
    return m3;
  });
}
function fmtTime(iso){
  try { return new Date(iso).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jerusalem'}); }
  catch(e){ return (iso||'').slice(11,16); }
}
function dayKey(iso){ return (iso||'').slice(0,10); }
function todayKey(){
  try { return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jerusalem'}); }
  catch(e){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
}
function keywords(q, city){
  var skip = ['רחוב','רח','מספר','ליד','על','יד','של','את','עם','אל'];
  return q.replace(city,'').split(/[\s,\/\\-]+/).filter(function(x){
    return x.length>2 && !/^\d+$/.test(x) && skip.indexOf(x)<0;
  });
}
function liveForStop(stop, box, btn){
  btn.disabled = true;
  box.innerHTML = '<div class="meta">טוען לוז וזמנים חיים...</div>';
  var now = new Date();
  var D = stop.date || todayKey();
  var base = Date.parse(D+'T00:00:00Z');
  if(isNaN(base)){ base = Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate(),0,0,0); D = todayKey(); }
  var q1 = API+'/gtfs_ride_stops/list?limit=200&gtfs_stop__code='+stop.code
    + '&arrival_time_from='+encodeURIComponent(new Date(base-3*3600000).toISOString())
    + '&arrival_time_to='+encodeURIComponent(new Date(base+21*3600000).toISOString())
    + '&order_by=arrival_time%20asc';
  var rowsByNum = {};
  var serving = {};
  fetchJSON(q1,20000).then(function(rides){
    rides = rides||[];
    if(!rides.length){ box.innerHTML = '<div class="meta">אין לוז לתחנה זו.</div>'; btn.disabled=false; btn.textContent='רענן זמנים'; return; }
    rides.forEach(function(r){
      var sn = r.gtfs_route__route_short_name || '?';
      if(!serving[sn]){ serving[sn]={num:sn, dest:(r.gtfs_route__route_long_name||'').split('<->')[0], op:r.gtfs_route__agency_name||''}; }
    });
    var tk = todayKey();
    var cutoff = (D===tk) ? now.getTime() : Date.parse(D+'T'+('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2)+':00+03:00');
    var up = rides.filter(function(r){ return Date.parse(r.arrival_time) >= cutoff-60000; }).slice(0,8);
    box.innerHTML = '';
    var note = document.createElement('div');
    note.className = 'meta';
    note.textContent = D===tk ? 'לוז להיום:' : 'לוז מתוכנן ('+D+'):';
    box.appendChild(note);
    if(!up.length){
      var e = document.createElement('div');
      e.className = 'meta';
      e.textContent = 'אין עוד נסיעות להיום בתחנה זו.';
      box.appendChild(e);
    }
    up.forEach(function(r){
      var sn = r.gtfs_route__route_short_name || '?';
      var info = serving[sn]||{num:sn,dest:'',op:''};
      var dv = document.createElement('div');
      dv.className = 'bus';
      dv.innerHTML = '<div class="num">קו ' + esc(info.num) + ' - ' + esc(fmtTime(r.arrival_time)) + '</div>'
        + '<div class="sub">מתוכנן' + (info.op?' · '+esc(info.op):'') + (info.dest?'<br>'+esc(info.dest):'') + '</div>';
      box.appendChild(dv);
      if(!rowsByNum[sn]) rowsByNum[sn] = [];
      rowsByNum[sn].push(dv);
    });
    say('לוז נטען. בודק חיים...');
    btn.disabled = false;
    btn.textContent = 'רענן זמנים';
  var d = 0.02;
  var q2 = API+'/siri_vehicle_locations/list?limit=50'
    + '&lat__greater_or_equal='+(stop.lat-d)+'&lat__lower_or_equal='+(stop.lat+d)
    + '&lon__greater_or_equal='+(stop.lon-d)+'&lon__lower_or_equal='+(stop.lon+d)
    + '&order_by=recorded_at_time%20desc';
  fetchJSON(q2,15000).then(function(vs){
    var fresh = (vs||[]).filter(function(v){ var a=agoMin(v.recorded_at_time); return a>=0 && a<=20 && v.lat!=null; });
    if(!fresh.length){ say('לוז נטען. אין חיים כרגע.'); return; }
    var lrs = [];
    fresh.forEach(function(v){ if(lrs.indexOf(v.siri_route__line_ref)<0) lrs.push(v.siri_route__line_ref); });
    batchLineInfo(lrs).then(function(lmap){
      var liveByNum = {};
      fresh.forEach(function(v){
        var info = lmap[v.siri_route__line_ref]||{num:String(v.siri_route__line_ref)};
        if(!serving[info.num]) return;
        var dd = distKm(stop.lat,stop.lon,v.lat,v.lon);
        var cur = liveByNum[info.num];
        if(!cur || dd<cur.d) liveByNum[info.num] = {d:dd, age:agoMin(v.recorded_at_time)};
      });
      var n = 0;
      Object.keys(liveByNum).forEach(function(sn){
        (rowsByNum[sn]||[]).forEach(function(dv){
          if(dv.querySelector('.eta')) return;
          var lv = liveByNum[sn];
          var b = document.createElement('div');
          b.className = 'eta';
          b.textContent = '🟢 חי - ' + Math.round(lv.d*1000) + ' מטר · לפני '+lv.age+' דקות';
          dv.appendChild(b);
          n++;
        });
      });
      say(n ? 'עודכן + ' + n + ' חיים.' : 'לוז נטען. אין חיים כרגע.');
    });
  }).catch(function(){ say('לוז נטען. חיים נכשלו.'); });
  }).catch(function(){
    box.innerHTML = '<div class="meta">נכשל בטעינה. נסה שוב.</div>';
    btn.disabled = false;
    say('שגיאת רשת.');
  });
}
function stopBlock(s, km){
  var d = document.createElement('div');
  d.className = 'stop';
  var where = (km>0.05) ? '<br>מרחק: ' + Math.round(km*1000) + ' מטר' : '';
  d.innerHTML = '<b>' + esc(s.name||'תחנה') + '</b><div class="meta">קוד: ' + s.code + ' | ' + esc(s.city||'') + where + '</div>';
  var box = document.createElement('div');
  box.className = 'live';
  var btn = document.createElement('button');
  btn.textContent = 'זמנים חיים';
  btn.onclick = function(){ liveForStop(s, box, btn); };
  d.appendChild(btn);
  d.appendChild(box);
  return d;
}
function showTitle(t){
  var h = document.createElement('h2');
  h.textContent = t;
  outEl.appendChild(h);
}
function searchAddr(){
  outEl.innerHTML = '';
  var q = (addrEl.value||'').trim() || 'יצחק נבון 52 שדרות';
  say('מחפש: ' + q + '...');
  var isHome = q.indexOf('יצחק נבון')>=0;
  var geoP = isHome
    ? Promise.resolve({lat:HOME_LAT, lon:HOME_LON, city:HOME_CITY})
    : fetchJSON('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=il&q='+encodeURIComponent(q+', ישראל'), 15000).then(function(g){
        if(!g||!g.length) throw new Error('לא נמצא');
        var a = g[0].address||{};
        return {lat:parseFloat(g[0].lat), lon:parseFloat(g[0].lon),
          city:(a.city||a.town||a.village||a.suburb||a.county||HOME_CITY)};
      }).catch(function(){
        return {lat:HOME_LAT, lon:HOME_LON, city:HOME_CITY};
      });
  geoP.then(function(geo){
    say('מוצא תחנות...');
    return getCityStops(geo.city).then(function(stops){
      if(!stops.length) throw new Error('אין תחנות ל'+geo.city);
      var i, shown = {};
      for(i=0;i<stops.length;i++){ stops[i]._d = distKm(geo.lat,geo.lon,stops[i].lat,stops[i].lon); }
      var kw = keywords(q, geo.city);
      var matches = [];
      if(kw.length){
        for(i=0;i<stops.length;i++){
          var nm = stops[i].name||'', okAll = true;
          for(var k=0;k<kw.length;k++){ if(nm.indexOf(kw[k])<0){ okAll=false; break; } }
          if(okAll){ matches.push(stops[i]); shown[stops[i].code]=1; }
        }
        if(!matches.length){
          for(i=0;i<stops.length;i++){
            var nm2 = stops[i].name||'';
            for(var k2=0;k2<kw.length;k2++){ if(nm2.indexOf(kw[k2])>=0){ matches.push(stops[i]); shown[stops[i].code]=1; break; } }
          }
        }
        matches.sort(function(a,b){return a._d-b._d;});
        matches = matches.slice(0,6);
      }
      stops.sort(function(a,b){return a._d-b._d;});
      outEl.innerHTML = '';
      if(matches.length){
        showTitle('לפי שם: ' + kw.join(' '));
        for(var m=0;m<matches.length;m++){ outEl.appendChild(stopBlock(matches[m], matches[m]._d)); }
        showTitle('הכי קרובות:');
      } else {
        say('תחנות קרובות - לחץ זמנים חיים:');
      }
      var n = 0;
      for(var j=0;j<stops.length && n<6;j++){
        if(shown[stops[j].code]) continue;
        outEl.appendChild(stopBlock(stops[j], stops[j]._d));
        n++;
      }
    });
  }).catch(function(e){
    say('שגיאה: '+(e.message||e)+' נסה מספר תחנה למטה.');
  });
}
function searchCode(){
  outEl.innerHTML = '';
  var code = (document.getElementById('code').value||'').replace(/\D/g,'');
  if(!code){ say('כתוב מספר תחנה, למשל 3948'); return; }
  say('בודק תחנה '+code+'...');
  fetchJSON(API+'/gtfs_stops/list?limit=3&code='+code, 20000).then(function(stops){
    outEl.innerHTML = '';
    if(stops&&stops.length){
      var s = dedupe(stops)[0];
      say(s.name+' - לחץ זמנים חיים:');
      outEl.appendChild(stopBlock(s, 0));
    } else { say('תחנה '+code+':'); }
  }).catch(function(){ say('שגיאת רשת.'); });
}
function placeGo(place){
  var cur = (addrEl.value||'').trim();
  var city = HOME_CITY;
  if(cur && cur.indexOf('יצחק נבון')<0 && cur !== place){
    city = cur;
    if(city.indexOf(place)>=0) city = city.replace(place,'').trim() || HOME_CITY;
  }
  addrEl.value = place + ' ' + city;
  searchAddr();
}
document.getElementById('b1').onclick = searchAddr;
document.getElementById('b2').onclick = searchCode;
document.getElementById('b3').onclick = function(){ placeGo('תחנה מרכזית'); };
document.getElementById('b4').onclick = function(){ placeGo('קניון'); };
window.onload = function(){ searchAddr(); };
</script>
</body>
</html>
